<!--
  Partial: alerts.html (Subfase 5.2, actualizado en Fase 6 / Subfase 6.1)
  Componente de notificaciones. Renderiza el framework de mensajes de
  Django (django.contrib.messages) con estilos alineados a brand.*.
  El contenedor #appeer-alerts existe SIEMPRE en el DOM (aunque no
  haya mensajes del servidor) porque static/js/core/notifications.js
  necesita un lugar fijo donde inyectar notificaciones generadas del
  lado del cliente (después de una petición fetch, por ejemplo). Los
  mensajes server-rendered y los generados por JS conviven en el
  mismo contenedor, con el mismo estilo.
-->
<div id="appeer-alerts" class="space-y-3 mb-6" aria-live="polite">
    {% for message in messages %}
        <div class="flex items-start gap-3 px-5 py-3.5 rounded-2xl shadow-card text-sm
              {% if message.tags == 'success' %}bg-green-50 text-green-800
              {% elif message.tags == 'error' %}bg-red-50 text-red-800
              {% elif message.tags == 'warning' %}bg-amber-50 text-amber-800
              {% else %}bg-brand-accent/10 text-brand-dark{% endif %}">
            {% if message.tags == 'success' %}
                <svg class="w-5 h-5 flex-shrink-0" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path fill="currentColor"
                          d="m10.562 15.908l6.396-6.396l-.708-.708l-5.688 5.688l-2.85-2.85l-.708.708zM12.003 21q-1.866 0-3.51-.708q-1.643-.709-2.859-1.924t-1.925-2.856T3 12.003t.709-3.51Q4.417 6.85 5.63 5.634t2.857-1.925T11.997 3t3.51.709q1.643.708 2.859 1.922t1.925 2.857t.709 3.509t-.708 3.51t-1.924 2.859t-2.856 1.925t-3.509.709"/>
                </svg>
            {% elif message.tags == 'error' %}
                <svg class="w-5 h-5 flex-shrink-0" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path fill="currentColor"
                          d="M12.434 16.28q.182-.182.182-.434t-.182-.433T12 15.23t-.434.182t-.182.433t.182.434t.434.181t.434-.181m-.934-3.126h1v-6h-1zM12.003 21q-1.866 0-3.51-.708q-1.643-.709-2.859-1.924t-1.925-2.856T3 12.003t.709-3.51Q4.417 6.85 5.63 5.634t2.857-1.925T11.997 3t3.51.709q1.643.708 2.859 1.922t1.925 2.857t.709 3.509t-.708 3.51t-1.924 2.859t-2.856 1.925t-3.509.709"/>
                </svg>
            {% elif message.tags == 'warning' %}
                <svg class="w-5 h-5 flex-shrink-0" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path fill="currentColor"
                          d="M2.73 20L12 4l9.27 16zm9.704-2.566q.182-.182.182-.434t-.182-.434t-.434-.181t-.434.181t-.181.434t.181.434t.434.181t.434-.181m-.934-2.05h1v-5h-1z"/>
                </svg>
            {% else %}
                <svg class="w-5 h-5 flex-shrink-0" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path fill="currentColor"
                          d="M11.5 16.5h1V11h-1zm.934-7.1q.182-.177.182-.439t-.178-.438T12 8.346t-.438.177t-.177.439t.181.438t.434.177t.434-.177m-.43 11.6q-1.868 0-3.511-.708q-1.643-.709-2.859-1.924t-1.925-2.856T3 12.003t.709-3.51Q4.417 6.85 5.63 5.634t2.857-1.925T11.997 3t3.51.709q1.643.708 2.859 1.922t1.925 2.857t.709 3.509t-.708 3.51t-1.924 2.859t-2.856 1.925t-3.509.709"/>
                </svg>{% endif %}
            <p class="pt-0.5">{{ message }}</p>
        </div>
    {% endfor %}
</div>
