{% extends "base.html" %}
{% block title %}{{ clase.nombre }} · AppEER{% endblock %}
{% block content %}
    <div class="flex items-center justify-between mb-6">
        <a href="{% url 'academico:clases_listado' %}"
           class="inline-flex items-center text-sm text-brand-accent hover:underline">&larr; Volver al listado</a>
        <div class="flex gap-3">
            <a href="{% url 'academico:clases_editar' id_clase=clase.id_clase %}"
               class="px-4 py-2 rounded-full border border-brand-border text-sm font-medium text-brand-dark hover:bg-brand-bg/60 transition-colors">Editar</a>
            <a href="{% url 'academico:clases_eliminar' id_clase=clase.id_clase %}"
               class="px-4 py-2 rounded-full border border-red-200 text-sm font-medium text-red-600 hover:bg-red-50 transition-colors">Eliminar</a>
        </div>
    </div>
    <section class="bg-brand-card rounded-[32px] p-8 shadow-card">
        <h1 class="text-2xl font-medium text-brand-dark mb-2">{{ clase.nombre }}</h1>
        <p class="text-sm text-brand-muted">Año {{ clase.anio }}</p>
    </section>
{% endblock %}
